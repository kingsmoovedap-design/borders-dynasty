name: Anchor CodexChain Scrolls

on:
  workflow_dispatch:

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Hash scrolls and contracts
        run: |
          mkdir -p codex-ledger
          sha256sum contracts/BSC.sol > codex-ledger/BSC.sol.hash
          sha256sum scrolls/*.md >> codex-ledger/scrolls.hash

      - name: Commit and push hashes
        run: |
          git config user.name "CodexChain Bot"
          git config user.email "codex@borders.dynasty"
          git add codex-ledger/
          git commit -m "Anchor scrolls and contract hashes to CodexChain"
          git push
